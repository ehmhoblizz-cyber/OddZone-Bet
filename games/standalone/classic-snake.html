<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Classic Snake</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#101820;color:#eef7ee;font:600 14px system-ui,sans-serif}body{display:grid;place-items:center}.shell{width:min(100vw,100dvh);padding:12px}.head{display:flex;justify-content:space-between;padding:8px 2px;color:#b7e9c2}canvas{display:block;width:100%;aspect-ratio:1;background:#17252b;border:1px solid #456253;touch-action:none}.controls{display:flex;justify-content:center;gap:8px;padding-top:10px}.controls button{width:56px;height:44px;border:1px solid #456253;background:#20343a;color:white;border-radius:8px;font-size:18px}
</style>
</head>
<body>
<main class="shell"><div class="head"><strong>CLASSIC SNAKE</strong><span>Score <b id="score">0</b></span></div><canvas id="game" width="400" height="400" aria-label="Classic Snake game"></canvas><div class="controls"><button data-dir="up" aria-label="Up">&#8593;</button><button data-dir="left" aria-label="Left">&#8592;</button><button data-dir="down" aria-label="Down">&#8595;</button><button data-dir="right" aria-label="Right">&#8594;</button></div></main>
<script>
(()=>{const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreNode=document.getElementById('score'),cells=20,size=canvas.width/cells;const vectors={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};let snake=[],direction='right',nextDirection='right',food={x:12,y:10},score=0,running=false,ended=false,last=0,elapsed=0;function placeFood(){do{food={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)}}while(snake.some(part=>part.x===food.x&&part.y===food.y))}function start(){snake=[{x:5,y:10},{x:4,y:10},{x:3,y:10}];direction=nextDirection='right';score=0;scoreNode.textContent='0';ended=false;running=true;last=performance.now();elapsed=0}function end(){running=false;ended=true}function turn(value){if(!running){start();return}const [x,y]=vectors[value],[dx,dy]=vectors[direction];if(x!==-dx||y!==-dy)nextDirection=value}function draw(now){const dt=Math.min(now-last,.1);last=now;if(running){elapsed+=dt;if(elapsed>=115){elapsed=0;direction=nextDirection;const [dx,dy]=vectors[direction],head={x:(snake[0].x+dx+cells)%cells,y:(snake[0].y+dy+cells)%cells};if(snake.some(part=>part.x===head.x&&part.y===head.y)){end()}else{snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;scoreNode.textContent=String(score);placeFood()}else snake.pop()}}}ctx.fillStyle='#17252b';ctx.fillRect(0,0,400,400);ctx.strokeStyle='rgba(185,225,194,.06)';for(let i=1;i<cells;i++){ctx.beginPath();ctx.moveTo(i*size,0);ctx.lineTo(i*size,400);ctx.moveTo(0,i*size);ctx.lineTo(400,i*size);ctx.stroke()}ctx.fillStyle='#ef8165';ctx.beginPath();ctx.arc((food.x+.5)*size,(food.y+.5)*size,size*.32,0,Math.PI*2);ctx.fill();snake.forEach((part,index)=>{ctx.fillStyle=index?'#44a475':'#a8e6a3';ctx.fillRect(part.x*size+1,part.y*size+1,size-2,size-2)});if(!running){ctx.fillStyle='rgba(5,12,15,.76)';ctx.fillRect(26,155,348,90);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='700 19px system-ui';ctx.fillText(ended?'ROUND OVER':'SNAKE',200,192);ctx.font='14px system-ui';ctx.fillText(ended?'Tap or press an arrow to retry':'Tap or press an arrow to start',200,220)}requestAnimationFrame(draw)}document.querySelectorAll('[data-dir]').forEach(button=>button.addEventListener('click',()=>turn(button.dataset.dir)));canvas.addEventListener('pointerdown',()=>{if(!running)start()});window.addEventListener('keydown',event=>{const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};if(map[event.key]){event.preventDefault();turn(map[event.key])}});window.__oddzoneStart=start;window.__oddzoneEnd=end;window.__oddzoneReadScore=()=>score;requestAnimationFrame(draw)})();
</script>
</body>
</html>
