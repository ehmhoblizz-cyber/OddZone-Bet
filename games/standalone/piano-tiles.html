<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Piano Tiles</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #090613;
    color: #ffffff;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
}
body {
    display: flex;
    justify-content: center;
    align-items: center;
}
#game-container {
    position: relative;
    width: min(100vw, 420px);
    height: 100vh;
    background: #0d0a1a;
    overflow: hidden;
    touch-action: none;
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
}
canvas {
    width: 100%;
    height: 100%;
    display: block;
}
#overlay {
    position: absolute;
    inset: 0;
    background: rgba(13, 10, 26, 0.88);
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    z-index: 10;
}
#overlay.hidden { display: none; }
.title {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #a78bfa, #ec4899, #38bdf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
}
.subtitle {
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 24px;
    line-height: 1.4;
}
.score-badge {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 12px 24px;
    margin-bottom: 24px;
}
.score-val {
    font-size: 36px;
    font-weight: 900;
    color: #38bdf8;
    font-family: monospace;
}
.play-btn {
    background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
    color: #050b14;
    font-size: 15px;
    font-weight: 800;
    border: none;
    border-radius: 14px;
    padding: 14px 36px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(56, 189, 248, 0.35);
    transition: transform 0.1s, filter 0.1s;
}
.play-btn:active {
    transform: scale(0.96);
    filter: brightness(1.1);
}
.keys-hint {
    margin-top: 20px;
    font-size: 11px;
    color: #64748b;
}
</style>
</head>
<body>

<div id="game-container">
    <canvas id="stage" width="360" height="640"></canvas>
    
    <div id="overlay">
        <div class="title" id="overlay-title">PIANO TILES</div>
        <p class="subtitle" id="overlay-desc">Tap the black tiles to play the melody.<br>Don't tap the white space!</p>
        <div class="score-badge" id="overlay-score-box" style="display:none;">
            <div style="font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: bold;">Score</div>
            <div class="score-val" id="final-score">0</div>
        </div>
        <button class="play-btn" id="start-btn" onclick="startGame()">START GAME</button>
        <div class="keys-hint">Keyboard: [D] [F] [J] [K] or Touch columns</div>
    </div>
</div>

<script>
(function() {
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const overlayScoreBox = document.getElementById('overlay-score-box');
    const finalScoreEl = document.getElementById('final-score');
    const startBtn = document.getElementById('start-btn');

    let W = canvas.width;
    let H = canvas.height;
    const COLS = 4;
    let colW = W / COLS;
    let tileH = H / 4.2;

    let score = 0;
    let isRunning = false;
    let isGameOver = false;
    let speed = 360; // px/sec
    let lastTime = 0;
    let tiles = []; // { col, y, h, hit, id }
    let tileIdCounter = 0;
    let audioCtx = null;
    let soundEnabled = true;

    // Pentatonic / Piano Scale frequencies
    const NOTES = [
        261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25,
        587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50
    ];

    function initAudio() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playNote(freq) {
        if (!soundEnabled || !audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.45);
        } catch(e) {}
    }

    function playFailSound() {
        if (!soundEnabled || !audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(140, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.35);
        } catch(e) {}
    }

    function spawnTile(y) {
        const col = Math.floor(Math.random() * COLS);
        tiles.push({
            id: ++tileIdCounter,
            col,
            y,
            h: tileH,
            hit: false
        });
    }

    function resetGame() {
        initAudio();
        score = 0;
        speed = 380;
        tiles = [];
        tileIdCounter = 0;
        isGameOver = false;

        // Populate initial tiles
        let curY = H - tileH;
        for (let i = 0; i < 6; i++) {
            curY -= tileH;
            spawnTile(curY);
        }
    }

    window.startGame = function() {
        resetGame();
        overlay.classList.add('hidden');
        isRunning = true;
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    };

    function triggerGameOver(reason) {
        if (isGameOver) return;
        isGameOver = true;
        isRunning = false;
        playFailSound();

        try {
            window.parent.postMessage({ type: 'oddzone:score', score }, '*');
            window.parent.postMessage({ type: 'oddzone:game-complete', score }, '*');
        } catch(e) {}

        setTimeout(() => {
            overlayTitle.textContent = 'GAME OVER';
            overlayDesc.textContent = reason || 'Missed a tile or tapped wrong column!';
            finalScoreEl.textContent = score;
            overlayScoreBox.style.display = 'block';
            startBtn.textContent = 'PLAY AGAIN';
            overlay.classList.remove('hidden');
        }, 350);
    }

    function handleHit(col, clientY) {
        if (!isRunning || isGameOver) return;

        // Find lowest unhit tile
        const unhitTiles = tiles.filter(t => !t.hit).sort((a, b) => (b.y + b.h) - (a.y + a.h));
        if (!unhitTiles.length) return;

        const target = unhitTiles[0];

        // Did player tap the right column and close enough to the tile?
        if (col === target.col && clientY >= target.y - 40 && clientY <= target.y + target.h + 80) {
            target.hit = true;
            score++;
            const noteIdx = (score * 2) % NOTES.length;
            playNote(NOTES[noteIdx]);

            // Speed up slightly
            speed = Math.min(880, speed + 7);

            // Report score to OddZone host
            try {
                window.parent.postMessage({ type: 'oddzone:score', score }, '*');
            } catch(e) {}
        } else {
            // Misclick
            triggerGameOver('Tapped the wrong tile or column!');
        }
    }

    function gameLoop(now) {
        if (!isRunning) return;
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        // Move tiles down
        for (let i = 0; i < tiles.length; i++) {
            tiles[i].y += speed * dt;
        }

        // Spawn new tile if top tile moved down
        const highestTile = tiles.reduce((min, t) => t.y < min ? t.y : min, H);
        if (highestTile > -tileH) {
            spawnTile(highestTile - tileH);
        }

        // Check for missed tile (unhit tile fell off screen)
        for (let i = 0; i < tiles.length; i++) {
            const t = tiles[i];
            if (!t.hit && t.y > H) {
                triggerGameOver('Missed a tile!');
                draw();
                return;
            }
        }

        // Clean up off-screen tiles
        tiles = tiles.filter(t => t.y < H + 100);

        draw();
        requestAnimationFrame(gameLoop);
    }

    function draw() {
        ctx.clearRect(0, 0, W, H);

        // Background
        ctx.fillStyle = '#0d0a1a';
        ctx.fillRect(0, 0, W, H);

        // Column lines
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
        ctx.lineWidth = 1;
        for (let i = 1; i < COLS; i++) {
            ctx.beginPath();
            ctx.moveTo(i * colW, 0);
            ctx.lineTo(i * colW, H);
            ctx.stroke();
        }

        // Draw tiles
        tiles.forEach(t => {
            const x = t.col * colW + 2;
            const width = colW - 4;
            const height = t.h - 4;

            if (t.hit) {
                // Hit tile: subtle glow / fading
                ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
                ctx.fillRect(x, t.y, width, height);
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
                ctx.strokeRect(x, t.y, width, height);
            } else {
                // Active black/neon tile
                const grad = ctx.createLinearGradient(x, t.y, x, t.y + height);
                grad.addColorStop(0, '#1e1b4b');
                grad.addColorStop(1, '#09090b');
                ctx.fillStyle = grad;
                ctx.fillRect(x, t.y, width, height);

                // Top highlight
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(x, t.y, width, 4);

                // Bottom glow
                ctx.fillStyle = 'rgba(168, 85, 247, 0.4)';
                ctx.fillRect(x, t.y + height - 3, width, 3);
            }
        });

        // Top Score Display
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 34px monospace';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(56, 189, 248, 0.6)';
        ctx.shadowBlur = 10;
        ctx.fillText(String(score), W / 2, 54);
        ctx.shadowBlur = 0;
    }

    // Input handlers
    function onPointer(e) {
        initAudio();
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX - rect.left;
        const clientY = (e.clientY - rect.top) * (H / rect.height);
        const col = Math.floor(clientX / (rect.width / COLS));
        handleHit(col, clientY);
    }

    canvas.addEventListener('pointerdown', onPointer);

    // Keyboard keys: D, F, J, K or 1, 2, 3, 4
    window.addEventListener('keydown', (e) => {
        initAudio();
        const key = e.key.toLowerCase();
        let col = -1;
        if (key === 'd' || key === '1') col = 0;
        else if (key === 'f' || key === '2') col = 1;
        else if (key === 'j' || key === '3') col = 2;
        else if (key === 'k' || key === '4') col = 3;

        if (col >= 0) {
            e.preventDefault();
            // Find lowest unhit tile
            const unhit = tiles.filter(t => !t.hit).sort((a, b) => (b.y + b.h) - (a.y + a.h))[0];
            const clientY = unhit ? unhit.y + unhit.h / 2 : H * 0.75;
            handleHit(col, clientY);
        }
    });

    // OddZone host integration
    window.addEventListener('message', (e) => {
        if (!e.data) return;
        if (e.data.type === 'oddzone:mute') {
            soundEnabled = !e.data.muted;
        } else if (e.data.type === 'oddzone:start') {
            if (!isRunning) window.startGame();
        } else if (e.data.type === 'oddzone:pause') {
            isRunning = false;
        } else if (e.data.type === 'oddzone:resume') {
            if (!isGameOver) {
                isRunning = true;
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }
        }
    });

    window.__oddzoneStart = window.startGame;
    window.__oddzoneReadScore = () => score;
    window.__oddzoneEnd = () => { if (isRunning && !isGameOver) triggerGameOver('Match ended'); };
    window.__oddzoneIsOver = () => isGameOver;
    draw();
})();
</script>
</body>
</html>
